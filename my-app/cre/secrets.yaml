# Maps the secret ids the workflow requests onto the environment variables that
# supply them. In production these are provisioned into the Vault DON; during
# `cre workflow simulate` they are read from the .env file passed with `-e`.
secretsNames:
  github_token:
    - CRE_GITHUB_TOKEN
  gemini_api_key:
    - CRE_GEMINI_API_KEY
