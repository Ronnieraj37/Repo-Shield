# ==========================================================================
# CRE PROJECT SETTINGS — RepoShield
# ==========================================================================
# RepoShield's workflow talks to GitHub and Gemini, not to a chain. The RPC
# entry is required by the CLI regardless of whether the workflow reads or
# writes onchain, so this is the public Sepolia endpoint the official
# templates use.
# ==========================================================================

staging-settings:
  rpcs:
    - chain-name: ethereum-testnet-sepolia
      url: https://ethereum-sepolia-rpc.publicnode.com

production-settings:
  rpcs:
    - chain-name: ethereum-testnet-sepolia
      url: https://ethereum-sepolia-rpc.publicnode.com
